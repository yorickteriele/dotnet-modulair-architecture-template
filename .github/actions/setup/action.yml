name: Setup toolchain
description: Installs the pinned .NET SDK and/or Node with the frontend's npm cache.

inputs:
  dotnet:
    description: Install the .NET SDK pinned in global.json.
    default: 'true'
  node:
    description: Install Node and cache the frontend's npm downloads.
    default: 'false'

runs:
  using: composite
  steps:
    - if: inputs.dotnet == 'true'
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - if: inputs.node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: src/frontend/package-lock.json
