name: Test, package and publish
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BACKEND_IMAGE: starter-backend:${{ github.sha }}
  FRONTEND_IMAGE: starter-frontend:${{ github.sha }}

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dotnet restore src/Starter.slnx --locked-mode
      - run: dotnet test src/Starter.slnx --no-restore -c Release -m:2 --logger trx --results-directory .local/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results-${{ github.sha }}
          path: .local/test-results/*.trx
          if-no-files-found: error

  backend-package:
    name: Backend package
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Publish backend and migration runner, build image
        run: ./tools/ci/package-backend.sh
      - uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: .local/packages/backend-image.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  generate-api-clients:
    name: Generate API clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: 'true'
      - run: dotnet tool restore
      - run: dotnet restore src/Starter.slnx --locked-mode
      - run: npm ci --prefix src/frontend
      # Exports OpenAPI from the built Host with the Swashbuckle CLI; no running API or database is needed.
      - run: npm run generate --prefix src/frontend
      - run: node tools/ci/archive-clients.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: api-clients-${{ github.sha }}
          path: .local/packages/api-clients.tar.gz
          retention-days: 7
          if-no-files-found: error

  frontend-package:
    name: Frontend package
    needs: [backend-package, generate-api-clients]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          dotnet: 'false'
          node: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: api-clients-${{ github.sha }}
          path: .local/packages
      - run: tar -xzf .local/packages/api-clients.tar.gz -C src/frontend
      - name: Build frontend with generated clients and package nginx image
        run: ./tools/ci/package-frontend.sh
      - uses: ./.github/actions/load-image
        with:
          component: backend
      - name: Smoke-test both packages and the frontend API proxy
        run: ./tools/ci/test-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-image-${{ github.sha }}
          path: .local/packages/frontend-image.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish-packages:
    name: Publish packages to GHCR
    needs: [backend-package, frontend-package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Local actions need the repository checked out.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-image
        with:
          component: backend
      - uses: ./.github/actions/load-image
        with:
          component: frontend
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            channel="$GITHUB_REF_NAME"
          else
            channel=latest
          fi
          for component in backend frontend; do
            source="starter-${component}:${GITHUB_SHA}"
            destination="${repository}/${component}"
            docker tag "$source" "${destination}:sha-${GITHUB_SHA}"
            docker push "${destination}:sha-${GITHUB_SHA}"
            docker tag "$source" "${destination}:${channel}"
            docker push "${destination}:${channel}"
          done
