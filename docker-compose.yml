services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: starter
      POSTGRES_DB: starter
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run tools/setup.sh first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
